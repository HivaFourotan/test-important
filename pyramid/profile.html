<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل کاربری | پیرامید</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none" width="34" height="34"><path d="M24 4 L44 40 H4 Z" fill="#6366f1"/><path d="M24 4 L34 22 L14 22 Z" fill="#3b82f6"/><path d="M24 14 L44 40 H30 L20 22 Z" fill="#818cf8"/></svg>
      <span>پیرامید</span>
    </a>
    <div class="header-actions">
      <button class="theme-toggle-btn" type="button" aria-label="تغییر تم"></button>
      <a href="index.html" class="btn btn-outline" style="padding:8px 18px;">بازگشت به خانه</a>
    </div>
  </div>
</header>

<div class="form-wrap">
  <div class="glass-card">
    <h2>تنظیمات حساب کاربری</h2>
    <p>اطلاعات نمایشی، تم و تصویر پروفایل خود را شخصی‌سازی کنید.</p>

    <div class="profile-avatar-box">
      <div class="profile-avatar-large">د</div>
      <div>
        <h3 style="font-size:16px; margin-bottom:4px;">تصویر و تم آواتار</h3>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">یک عکس آپلود کنید یا از گرادیان‌های پیش‌فرض استفاده نمایید:</p>
        <div class="gradient-picker">
          <div class="gradient-opt g-1" data-grad="g-1" title="بنفش رویال"></div>
          <div class="gradient-opt g-2" data-grad="g-2" title="الکتریک سایبر"></div>
          <div class="gradient-opt g-3" data-grad="g-3" title="آبی فیروزه‌ای"></div>
        </div>
      </div>
    </div>

    <form id="profile-form">
      <div class="form-field">
        <label for="avatar-upload">آپلود عکس جدید</label>
        <input type="file" id="avatar-upload" accept="image/*">
      </div>

      <div class="form-field">
        <label for="profile-name">نام و نام خانوادگی (نام نمایشی)</label>
        <input type="text" id="profile-name" placeholder="مثلا: دانش‌آموز مک" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
        ذخیره تغییرات پروفایل
      </button>
    </form>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>

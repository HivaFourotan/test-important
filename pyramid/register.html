<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام و ورود | پیرامید</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 48 48" fill="none" width="34" height="34"><path d="M24 4 L44 40 H4 Z" fill="#6366f1"/><path d="M24 4 L34 22 L14 22 Z" fill="#3b82f6"/><path d="M24 14 L44 40 H30 L20 22 Z" fill="#818cf8"/></svg>
      <span>پیرامید</span>
    </a>
    <button class="theme-toggle-btn" type="button" aria-label="تغییر تم"></button>
  </div>
</header>

<div class="form-wrap">
  <div class="glass-card">
    <h2>ثبت‌نام در سامانه پیرامید</h2>
    <p>با ساخت حساب، کارنامه‌ها و تحلیل‌های خود را به صورت دائمی ذخیره کنید.</p>

    <form action="profile.html" method="GET">
      <div class="form-field">
        <label for="reg-name">نام و نام خانوادگی</label>
        <input type="text" id="reg-name" placeholder="مثلا محمد علیزاده" required>
      </div>

      <div class="form-field">
        <label for="reg-phone">شماره همراه</label>
        <input type="tel" id="reg-phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" pattern="09[0-9]{9}" required>
      </div>

      <div class="form-field">
        <label for="reg-field">رشته تحصیلی</label>
        <select id="reg-field">
          <option>علوم تجربی</option>
          <option>ریاضی و فیزیک</option>
          <option>علوم انسانی</option>
          <option>هنر و منحصراً زبان</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;">
        ثبت‌نام و ورود به پنل
      </button>
    </form>
    <p class="form-note">قبلاً ثبت‌نام کرده‌اید؟ <a href="profile.html" style="color:var(--primary); font-weight:700;">ورود به حساب</a></p>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
